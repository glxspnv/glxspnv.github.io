<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141923"><title>게임 시나리오 포트폴리오</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="identity"><a class="home-link" href="game.html?game=seoul" aria-label="포트폴리오 홈">←<span>작품 목록</span></a><div><div class="eyebrow">GAME SCENARIO PORTFOLIO</div><h1 id="work-title">시나리오 불러오는 중…</h1></div></div><div class="header-right"><span class="count"><span id="work-count"></span></span><button id="restart" class="button">처음부터 읽기 <span aria-hidden="true">↗</span></button></div></header>
<main class="workspace">
<section class="map-pane" aria-label="시나리오 분기도"><div class="map-header"><div><span class="section-no">01</span><h2>분기 구조</h2></div><span class="map-hint">장면을 선택해 원문 확인</span></div>
<nav class="stages" aria-label="구간 바로가기"></nav>
<div class="map-scroll" id="map-scroll"><div id="map-canvas"><svg id="graph" role="group" aria-label="전체 시나리오 분기"></svg></div></div><div class="map-bottom"><div class="legend"><span><i class="line"></i>진행</span><span><i class="line dashed"></i>조건·판정</span><span><i class="dot"></i>현재 장면</span></div><div class="zoom-controls"><button id="zoom-out" aria-label="분기도 축소">−</button><span id="zoom-label">85%</span><button id="zoom-in" aria-label="분기도 확대">+</button><button id="fit" class="fit">전체</button><button id="focus" class="fit">현재</button></div></div></section>
<section class="reader-pane" aria-label="장면 원문과 선택지"><div class="reader-toolbar"><div><span class="section-no">02</span><h2>장면 읽기</h2></div><button id="back" class="back" disabled>← 이전</button></div><div id="reader-scroll" class="reader-scroll"><div id="reader"></div></div><footer class="reader-footer"><span>검토 모드</span> 모든 조건 경로 열람 가능</footer></section>
</main>
<script src="story-engine.js?v=condition-route-4"></script>
<script src="projects.js?v=condition-route-4"></script>
<script src="reader-loader.js?v=condition-route-4"></script>
</body></html>
